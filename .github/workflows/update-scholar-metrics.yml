name: Update Scholar metrics

on:
  schedule:
    # Mondays at 16:00 UTC
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Google Scholar metrics
        run: python scripts/update_scholar_metrics.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- scholar-metrics.json; then
            echo "No metrics changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar-metrics.json
          git commit -m "Update Google Scholar citation metrics"
          git push
