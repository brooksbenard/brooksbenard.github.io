name: Update Scholar metrics

on:
  schedule:
    # Daily at 14:23 UTC. Scholar often blocks GitHub runner IPs; running
    # daily (off the top of the hour) gives more chances to succeed.
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch Google Scholar metrics
        run: python -u scripts/update_scholar_metrics.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- scholar-metrics.json; then
            echo "No metrics changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar-metrics.json
          git commit -m "Update Google Scholar citation metrics"
          git push
