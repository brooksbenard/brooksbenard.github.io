<!-- scIMPEL custom: Central hub with radiating lines to nodes (schematic concept) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dashed radiating lines -->
  <g stroke="#6b7280" stroke-width="1" stroke-dasharray="4 2" fill="none">
    <path d="M32 20 L12 45"/>
    <path d="M32 20 L22 52"/>
    <path d="M32 20 L32 54"/>
    <path d="M32 20 L42 52"/>
    <path d="M32 20 L52 45"/>
  </g>
  <!-- Central scIMPEL box -->
  <rect x="16" y="8" width="32" height="14" rx="3" fill="white" stroke="#374151" stroke-width="1"/>
  <text x="32" y="19" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#1e3a5f" text-anchor="middle">scIMPEL</text>
  <!-- Gradient nodes -->
  <circle cx="12" cy="45" r="5" fill="#c41e3a" stroke="#9b1529"/>
  <circle cx="22" cy="52" r="5" fill="#ef4444" stroke="#dc2626"/>
  <circle cx="32" cy="54" r="5" fill="#9ca3af" stroke="#6b7280"/>
  <circle cx="42" cy="52" r="5" fill="#3b82f6" stroke="#2563eb"/>
  <circle cx="52" cy="45" r="5" fill="#1d4ed8" stroke="#1e40af"/>
</svg>
