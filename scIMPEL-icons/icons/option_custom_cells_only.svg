<!-- scIMPEL custom: Concentric circles (cell + nucleus) in gradient -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Single featured cell with nucleus - red (start of spectrum) -->
  <circle cx="32" cy="32" r="18" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <circle cx="32" cy="32" r="8" fill="#c41e3a"/>
  <!-- Smaller cells in corners showing gradient -->
  <circle cx="12" cy="12" r="6" fill="#c41e3a" stroke="#9b1529"/>
  <circle cx="52" cy="12" r="6" fill="#1d4ed8" stroke="#1e40af"/>
  <circle cx="12" cy="52" r="6" fill="#c41e3a" stroke="#9b1529"/>
  <circle cx="52" cy="52" r="6" fill="#1d4ed8" stroke="#1e40af"/>
</svg>
