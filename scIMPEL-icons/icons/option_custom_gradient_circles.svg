<!-- scIMPEL custom: Gradient circles from schematic (red ’ grey ’ blue) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c41e3a"/>
      <stop offset="33%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#6b7280"/>
      <stop offset="66%" stop-color="#3b82f6"/>
